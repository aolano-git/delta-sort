<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Delta Results</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Projector screen: orange band, two big numbers, score bars left, most-missed right. */
:root{--navy:#0B2343;--orange:#F26A10;--bg:#F3F5F8;--surface:#fff;--fg:#13213A;--muted:#5B6A80;--line:#D5DCE6;
--display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Barlow",system-ui,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:18px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--orange);color:#fff}
header .wrap{padding-block:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brandrow{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{background:#fff;border-radius:6px;padding:6px 10px;display:inline-flex;line-height:0}
.logo img{height:22px;width:auto}
.eyebrow{font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;font-size:14px}
h1{font-family:var(--display);font-size:clamp(30px,4vw,48px);margin:0;line-height:1}
select{font:inherit;font-size:16px;padding:8px 10px;border-radius:8px;border:0;color:var(--fg);background:#fff}
main .wrap{padding-block:22px 40px;display:grid;grid-template-columns:3fr 2fr;gap:22px}
@media (max-width:800px){main .wrap{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.stats{grid-column:1/-1;display:flex;gap:16px;flex-wrap:wrap}
.stat{flex:1;min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 20px}
.stat b{display:block;font-family:var(--display);font-size:clamp(44px,6vw,72px);line-height:1;font-variant-numeric:tabular-nums;color:var(--navy)}
.stat.hi b{color:var(--orange)}
.stat span{color:var(--muted)}
h2{font-family:var(--display);font-size:26px;margin:0 0 14px}
.row{display:grid;grid-template-columns:64px 1fr 92px;align-items:center;gap:12px;margin-bottom:8px}
.row .lbl{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.track{height:30px;background:var(--bg);border-radius:6px;overflow:hidden}
.track i{display:block;height:100%;background:var(--navy);transition:width .6s}
.row.top .track i{background:var(--orange)}
.row .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.row .n small{color:var(--muted);font-weight:400}
.miss{display:flex;flex-direction:column;gap:12px}
.mi{border-left:4px solid var(--orange);padding:4px 0 4px 12px}
.mi q{display:block;font-size:20px;font-weight:600;quotes:"\201C" "\201D"}
.mi span{color:var(--muted);font-size:16px}
.empty{color:var(--muted)}
.foot{grid-column:1/-1;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){.track i{transition:none}}
</style>
</head>

  <h1>How did the room sort the statements?</h1></div>
  <label><span class="eyebrow">Session </span><select id="day"></select></label>
</div></header>
<main><div class="wrap">
  <div class="stats">
    <div class="stat"><b id="total">0</b><span>participants answered</span></div>
    <div class="stat hi"><b id="perfect">0%</b><span>got all 8 right</span></div>
    <div class="stat"><b id="avg">0</b><span>average score, out of 8</span></div>
  </div>
  <section class="panel"><h2>Scores</h2><div id="bars"></div></section>
  <section class="panel"><h2>Most often misplaced</h2><div class="miss" id="miss"><p class="empty">Waiting for answers…</p></div></section>
  <p class="foot" id="foot">Updates every 5 seconds. Anonymous: no names are collected.</p>
</div></main>
<script>
const ENDPOINT="https://script.google.com/macros/s/AKfycbyREKAUcgfmGkxEllFW2tPL2Py1S0azl5srLe0F6HNV-RhSP317dvUOez9G9tkpfCyZ/exec";
const TEXT={a0:["About a particular team member","A"],p0:["About team performance","P"],a1:["Completed by superiors/officers","A"],p1:["Answered by everyone on board","P"],a2:["Affects bonuses, salaries, contracts, or promotion decisions","A"],p2:["No impact on bonuses, salaries, contracts, or promotion decisions","P"],a3:["To evaluate individual performance against performance standards","A"],p3:["To bridge the gap between work as imagined and work as done","P"]};
const sel=document.getElementById("day");let chosen=null;
sel.addEventListener("change",()=>{chosen=sel.value;load()});
function fmt(d){const t=new Date(d+"T00:00:00");return isNaN(t)?d:t.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}
async function load(){
  try{
    const r=await fetch(ENDPOINT+(chosen?"?day="+encodeURIComponent(chosen):""));const d=await r.json();
    const days=d.days.includes(d.today)?d.days:d.days.concat(d.today);
    if(sel.options.length!==days.length){sel.innerHTML=days.map(x=>`<option value="${x}">${fmt(x)}${x===d.today?" (today)":""}</option>`).join("")}
    sel.value=d.day;
    const t=d.total,max=Math.max(1,...d.dist);
    document.getElementById("total").textContent=t;
    document.getElementById("perfect").textContent=t?Math.round(d.dist[8]/t*100)+"%":"0%";
    document.getElementById("avg").textContent=t?(d.dist.reduce((a,c,i)=>a+c*i,0)/t).toFixed(1):"0";
    let h="";for(let i=8;i>=0;i--){const c=d.dist[i];h+=`<div class="row${i===8?" top":""}"><span class="lbl">${i}/8</span><div class="track"><i style="width:${c/max*100}%"></i></div><span class="n">${c} <small>${t?Math.round(c/t*100):0}%</small></span></div>`}
    document.getElementById("bars").innerHTML=h;
    const m=Object.entries(d.misses).sort((a,b)=>b[1]-a[1]).slice(0,3);
    document.getElementById("miss").innerHTML=m.length?m.map(([id,n])=>`<div class="mi"><q>${TEXT[id]?TEXT[id][0]:id}</q><span>Missed by ${n} of ${t} (${Math.round(n/t*100)}%). Belongs in ${TEXT[id]&&TEXT[id][1]==="A"?"Appraisal":"Performance Delta"}.</span></div>`).join(""):'<p class="empty">Waiting for answers…</p>';
    document.getElementById("foot").textContent="Updates every 5 seconds. Anonymous: no names are collected. Last update "+new Date().toLocaleTimeString();
  }catch(e){document.getElementById("foot").textContent="Can't reach the results sheet right now. Retrying…"}
}
load();setInterval(load,5000);
</script>
